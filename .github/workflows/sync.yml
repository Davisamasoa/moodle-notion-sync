name: Sync Moodle -> Notion

on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Completar cadeia de certificados da UFOP
        run: |
          HOST=moodlepresencial.ufop.br
          echo | openssl s_client -connect $HOST:443 -servername $HOST 2>/dev/null | openssl x509 > leaf.pem
          URL=$(openssl x509 -in leaf.pem -noout -ext authorityInfoAccess | grep -o 'CA Issuers - URI:.*' | sed 's/CA Issuers - URI://')
          echo "Intermediario: $URL"
          curl -sSL "$URL" -o inter.crt
          openssl x509 -inform DER -in inter.crt -out inter.pem 2>/dev/null || cp inter.crt inter.pem
          cat /etc/ssl/certs/ca-certificates.crt inter.pem > ca.pem
          echo "SSL_CERT_FILE=$PWD/ca.pem" >> $GITHUB_ENV
      - run: python sync.py
        env:
          MOODLE_URL: ${{ secrets.MOODLE_URL }}
          MOODLE_TOKEN: ${{ secrets.MOODLE_TOKEN }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
