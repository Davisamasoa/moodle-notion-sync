name: debug-moodle
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -skI https://moodlepresencial.ufop.br/ | head -15
          echo "BYTES=$(curl -sk https://moodlepresencial.ufop.br/ | wc -c)"
          for h in moodlepresencial.ufop.br/moodle moodlepresencial.ufop.br/2026 moodle.ufop.br www.moodle.ufop.br moodlepresencial2.ufop.br ava.ufop.br; do
            echo "$h -> $(curl -sk -o /dev/null -m 10 -w '%{http_code} %{redirect_url}' https://$h/login/index.php)"
          done
