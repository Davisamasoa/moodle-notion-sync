name: debug-moodle
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sk https://moodlepresencial.ufop.br/ | sed 's/<[^>]*script[^>]*>.*//' | grep -oiE '(href|action|http-equiv|url=)[^ >]{0,140}|<title>[^<]*' | sort -u | head -40
          echo "---"; curl -sk https://moodlepresencial.ufop.br/ | sed 's/<[^>]*>/ /g' | tr -s ' \n' ' ' | head -c 1500
